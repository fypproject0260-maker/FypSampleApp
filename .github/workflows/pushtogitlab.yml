name: Mirror to GitLab

on:
  push:
    branches: ['**']
    tags: ['**']
  delete:
  workflow_dispatch:

jobs:
  mirror:
    runs-on: ubuntu-latest
    steps:
      - name: Mirror all branches and tags
        env:
          GITLAB_TOKEN: ${{ secrets.GITLAB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git clone --mirror "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" repo
          cd repo
          git push --prune \
            "https://oauth2:${GITLAB_TOKEN}@gitlab.com/ditfyp-group/FypSampleApp.git" \
            '+refs/heads/*:refs/heads/*' '+refs/tags/*:refs/tags/*'

<!DOCTYPE html>
<html>
<head>
  <title>Sign Up</title>

  <style>
    body {
      font-family: Arial;
      background: #3f4897;
      text-align: center;
      padding-top: 100px;
    }
    .box {
      background: white;
      width: 280px;
      margin: auto;
      padding: 30px;
      border-radius: 8px;
    }
    input {
      width: 100%;
      padding: 10px;
      margin-bottom: 10px;
      box-sizing: border-box;
    }
    button {
      width: 100%;
      padding: 10px;
      background: blue;
      color: white;
      border: none;
      cursor: pointer;
    }
    .small {
      font-size: 13px;
      margin-top: 15px;
    }
    .small a {
      color: blue;
    }
  </style>
</head>

<body>
  <div class="box">
    <h2>Sign Up</h2>
    <form method="post" action="/signup">
      <input type="text" name="username" placeholder="Username" required>
      <input type="password" name="password" placeholder="Password" required>
      <button type="submit">Sign Up</button>
    </form>

    <p class="small">Already have an account? <a href="/">Log in here</a></p>
  </div>
</body>
</html>

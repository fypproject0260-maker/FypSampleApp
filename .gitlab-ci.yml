
stages:
  - build
  - test
  - build-sonar
  - deploy

default:
  tags:
    - ubuntu-local

# 1. BUILD: Build Docker image
build:
  stage: build
  script:
    - docker build -t fypsampleapp:$CI_COMMIT_SHORT_SHA -t fypsampleapp:latest .

# 2. TEST: Run unit tests and smoke test
test:
  stage: test
  script:
    - docker run --rm --user "$(id -u):$(id -g)" -e npm_config_cache=/tmp/.npm -v "$PWD":/app -w /app node:20-alpine sh -c "npm ci && node --check server.js"
    - docker rm -f fypsampleapp-test || true
    - docker run -d --name fypsampleapp-test fypsampleapp:latest
    - sleep 5
    - docker exec fypsampleapp-test wget -qO- http://localhost:6767/
  after_script:
    - docker rm -f fypsampleapp-test || true

# 3. SONARQUBE: Analyze code quality
build-sonar:
  stage: build-sonar
  variables:
    GIT_DEPTH: "0"
  script:
    - docker run --rm --network host --user "$(id -u):$(id -g)" -e SONAR_USER_HOME=/tmp/.sonar -e SONAR_HOST_URL -e SONAR_TOKEN -v "$PWD":/usr/src sonarsource/sonar-scanner-cli:11
  allow_failure: true
  rules:
    - if: '$CI_PIPELINE_SOURCE == "merge_request_event"'
    - if: '$CI_COMMIT_BRANCH == "master"'
    - if: '$CI_COMMIT_BRANCH == "main"'
    - if: '$CI_COMMIT_BRANCH == "develop"'

# 4. DEPLOY: Deploy using Docker Compose
deploy:
  stage: deploy
  script:
    - docker compose up -d --build --force-recreate
    - docker compose ps
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

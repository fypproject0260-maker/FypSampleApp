stages:
  - build
  - test
  - build-sonar
  - push
  - deploy

default:
  tags:
    - ubuntu-local

variables:
  ECR_REGISTRY: "279264839125.dkr.ecr.ap-southeast-2.amazonaws.com"
  ECR_REPO: "fyp-sample-app"
  K8S_DEPLOYMENT: "fyp-sample-app"
  K8S_CONTAINER: "fyp-sample-app"

# 1. BUILD: Build Docker image
build:
  stage: build
  script:
    - docker build -t fypsampleapp:$CI_COMMIT_SHORT_SHA -t fypsampleapp:latest .

# 2. TEST: Run unit tests and smoke test
# 2. TEST: syntax check, dependency audit, smoke + functional tests
test:
  stage: test
  variables:
    TEST_NET: "fyp-test-net-$CI_PIPELINE_ID"
    TEST_APP: "fyp-test-app-$CI_PIPELINE_ID"
    TEST_DB: "fyp-test-db-$CI_PIPELINE_ID"
    JAR_DIR: "/tmp/fyp-test-jar-$CI_PIPELINE_ID"
  script:
    # Level 1a: syntax check
    - docker run --rm -v "$PWD":/app:ro -w /app node:20-alpine node --check server.js

    # Dependency audit: fail on high/critical vulnerabilities in production packages
    - docker run --rm -v "$PWD":/app:ro -w /app node:20-alpine npm audit --omit=dev --audit-level=high

    # Private test network + throwaway Postgres (test-only credentials, not real secrets)
    - docker network create "$TEST_NET"
    - docker run -d --name "$TEST_DB" --network "$TEST_NET" -e POSTGRES_USER=ci -e POSTGRES_PASSWORD=ci -e POSTGRES_DB=ci postgres:16-alpine
    - |
      for i in $(seq 1 30); do
        # -h 127.0.0.1 = TCP check, only succeeds once Postgres has fully finished initialising
        if docker exec "$TEST_DB" pg_isready -h 127.0.0.1 -U ci -d ci >/dev/null 2>&1; then
          echo "Postgres is up after ${i}s"; break
        fi
        if [ "$i" -eq 30 ]; then echo "Postgres did not start within 30s"; docker logs "$TEST_DB"; exit 1; fi
        sleep 1
      done

    # Level 1b: start THIS commit's image, pointed at the test database (no host port, so no clash with 6767)
    - >
      docker run -d --name "$TEST_APP" --network "$TEST_NET"
      -e DB_HOST="$TEST_DB" -e DB_USER=ci -e DB_PASSWORD=ci -e DB_NAME=ci
      -e SESSION_SECRET=ci-test-only-secret
      fypsampleapp:$CI_COMMIT_SHORT_SHA
    - |
      for i in $(seq 1 60); do
        if docker exec "$TEST_APP" wget -qO- http://localhost:6767/healthz >/dev/null 2>&1; then
          echo "App is up and connected to Postgres after ${i}s"; break
        fi
        if [ "$i" -eq 60 ]; then
          echo "App did not become healthy within 60s"; docker logs "$TEST_APP"; exit 1
        fi
        sleep 1
      done

    # Levels 2 + 3: smoke and functional tests with curl, from a separate container.
    # The cookie jar (shared folder) lets consecutive curl calls act like ONE browser session.
    - docker pull -q curlimages/curl:8.10.1
    - mkdir -p "$JAR_DIR" && chmod 777 "$JAR_DIR"
    - |
      CURL="docker run --rm --network $TEST_NET curlimages/curl:8.10.1 -s"
      CURLJ="docker run --rm --network $TEST_NET -v $JAR_DIR:/jar curlimages/curl:8.10.1 -s -b /jar/cookies.txt -c /jar/cookies.txt"
      APP="http://$TEST_APP:6767"
      USER_NAME="ciuser"
      FAILED=0
      check() { if echo "$3" | grep -q "$2"; then echo "PASS: $1"; else echo "FAIL: $1 (expected '$2', got '$3')"; FAILED=1; fi; }

      # Level 2: pages load
      check "Login page loads (200)"               "^200"          "$($CURL -o /dev/null -w '%{http_code}' $APP/)"
      check "Login page has a form"                "<form"         "$($CURL $APP/)"
      check "Signup page loads (200)"              "^200"          "$($CURL -o /dev/null -w '%{http_code}' $APP/signup)"
      check "Health check reports database ok"     "^ok$"          "$($CURL $APP/healthz)"

      # Level 3: app logic
      check "/home redirects to / when logged out" "^302 /$"       "$($CURL -o /dev/null -w '%{http_code} %header{location}' $APP/home)"
      check "Signup redirects to /home"            "^302 /home$"   "$($CURLJ -o /dev/null -w '%{http_code} %header{location}' -d "username=$USER_NAME&password=secret123" $APP/signup)"
      check "Welcome page shows the username"      "Welcome, $USER_NAME" "$($CURLJ $APP/home)"
      check "Other visitors are NOT logged in"     "^302 /$"       "$($CURL -o /dev/null -w '%{http_code} %header{location}' $APP/home)"
      check "Duplicate username is rejected"       "already taken" "$($CURL -d "username=$USER_NAME&password=other" $APP/signup)"
      check "Logout redirects to /"                "^302 /$"       "$($CURLJ -o /dev/null -w '%{http_code} %header{location}' -X POST $APP/logout)"
      check "Logged out session can't see /home"   "^302 /$"       "$($CURLJ -o /dev/null -w '%{http_code} %header{location}' $APP/home)"
      check "Wrong password is rejected"           "Wrong username or password" "$($CURL -d "username=$USER_NAME&password=wrong" $APP/login)"
      check "Correct login redirects to /home"     "^302 /home$"   "$($CURLJ -o /dev/null -w '%{http_code} %header{location}' -d "username=$USER_NAME&password=secret123" $APP/login)"

      # Level 3b: the account really is in Postgres, and the password is not stored as plain text
      check "User row saved in Postgres"           "^1$"           "$(docker exec $TEST_DB psql -U ci -d ci -tAc "SELECT count(*) FROM users WHERE username='$USER_NAME'")"
      check "Password not stored as plain text"    "^0$"           "$(docker exec $TEST_DB psql -U ci -d ci -tAc "SELECT count(*) FROM users WHERE username='$USER_NAME' AND password_hash='secret123'")"

      if [ "$FAILED" -ne 0 ]; then echo "Some tests failed"; exit 1; fi
      echo "All tests passed"
  after_script:
    - docker logs "$TEST_APP" || true
    - docker rm -f "$TEST_APP" "$TEST_DB" || true
    - docker network rm "$TEST_NET" || true
    - rm -rf "$JAR_DIR" || true

# 3. SONARQUBE: Scan the code for bugs and security problems
build-sonar:
  stage: build-sonar
  variables:
    GIT_DEPTH: "0"
  script:
    - >
      docker run --rm
      --network host
      --user "$(id -u):$(id -g)"
      -v "$CI_PROJECT_DIR":/usr/src
      -e SONAR_HOST_URL="$SONAR_HOST_URL"
      -e SONAR_TOKEN="$SONAR_TOKEN"
      -e SONAR_USER_HOME=/usr/src/.sonar
      sonarsource/sonar-scanner-cli:11
  allow_failure: true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 4. PUSH: Publish the image to Amazon ECR
push:
  stage: push
  script:
    - aws --version
    - aws sts get-caller-identity --query Arn --output text
    - aws ecr get-login-password --region "$AWS_DEFAULT_REGION" | docker login --username AWS --password-stdin "$ECR_REGISTRY"
    - docker tag fypsampleapp:$CI_COMMIT_SHORT_SHA $ECR_REGISTRY/$ECR_REPO:$CI_COMMIT_SHORT_SHA
    - docker push $ECR_REGISTRY/$ECR_REPO:$CI_COMMIT_SHORT_SHA
    - docker tag fypsampleapp:$CI_COMMIT_SHORT_SHA $ECR_REGISTRY/$ECR_REPO:latest
    - docker push $ECR_REGISTRY/$ECR_REPO:latest
  after_script:
    - docker logout "$ECR_REGISTRY" || true
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'

# 5. DEPLOY: Roll out the new image to Amazon EKS
deploy:
  stage: deploy
  variables:
    KUBECONFIG: "/tmp/kubeconfig-$CI_PIPELINE_ID"
  script:
    - kubectl version --client
    - aws eks update-kubeconfig --name fyp-eks-cluster --region "$AWS_DEFAULT_REGION"
    - kubectl set image deployment/$K8S_DEPLOYMENT $K8S_CONTAINER=$ECR_REGISTRY/$ECR_REPO:$CI_COMMIT_SHORT_SHA
    - kubectl rollout status deployment/$K8S_DEPLOYMENT --timeout=180s || (kubectl rollout undo deployment/$K8S_DEPLOYMENT && exit 1)
    - kubectl get pods -l app=fyp-sample-app -o wide
  after_script:
    - rm -f "/tmp/kubeconfig-$CI_PIPELINE_ID"
  rules:
    - if: '$CI_COMMIT_BRANCH == "main"'
